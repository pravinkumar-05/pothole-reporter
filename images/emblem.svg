<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Ashoka Lion Capital Stylized Emblem -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Base Abacus Pedestal -->
    <rect x="22" y="80" width="56" height="5" rx="2"/>
    <rect x="18" y="85" width="64" height="6" rx="3"/>
    
    <!-- Central Ashoka Chakra in Base -->
    <circle cx="50" cy="74" r="7" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <circle cx="50" cy="74" r="2" fill="url(#goldGrad)"/>
    
    <!-- Left and Right flanking animals base -->
    <path d="M 28,76 Q 34,70 40,75 L 40,78 L 26,78 Z"/>
    <path d="M 72,76 Q 66,70 60,75 L 60,78 L 74,78 Z"/>
    
    <!-- Central Lion Head & Mane -->
    <!-- Head crown -->
    <path d="M 44,22 Q 50,14 56,22 Q 62,28 58,36 Q 50,42 42,36 Q 38,28 44,22 Z"/>
    <!-- Mane details -->
    <path d="M 40,32 Q 32,38 36,48 Q 44,56 50,56 Q 56,56 64,48 Q 68,38 60,32 Z"/>
    <!-- Central lion snout & mouth -->
    <path d="M 47,30 Q 50,28 53,30 L 52,36 Q 50,38 48,36 Z" fill="#FFF8E7"/>
    
    <!-- Left Lion Profile -->
    <path d="M 36,24 Q 26,18 22,28 Q 18,38 24,46 Q 30,52 38,48 Q 32,38 36,24 Z"/>
    <!-- Left Lion ear & eye -->
    <circle cx="28" cy="28" r="1.5" fill="#FFF8E7"/>
    
    <!-- Right Lion Profile -->
    <path d="M 64,24 Q 74,18 78,28 Q 82,38 76,46 Q 70,52 62,48 Q 68,38 64,24 Z"/>
    <!-- Right Lion ear & eye -->
    <circle cx="72" cy="28" r="1.5" fill="#FFF8E7"/>
    
    <!-- Pillars / Body support -->
    <path d="M 34,50 Q 30,62 36,70 L 64,70 Q 70,62 66,50 Q 58,58 50,58 Q 42,58 34,50 Z"/>
    
    <!-- Pectoral & Leg definition -->
    <line x1="42" y1="58" x2="40" y2="70" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="58" y1="58" x2="60" y2="70" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
</svg>

